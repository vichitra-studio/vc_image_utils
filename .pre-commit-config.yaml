# pre-commit builds addlicense in its own isolated environment (~/.cache/pre-commit).
# addlicense itself does not need a global install, but `language: golang` hooks
# require Go to already be on the system PATH — pre-commit does not install Go.
# See BUILDING.md (Contributing prerequisites) for Go and pre-commit install instructions.
# Install the hooks once with:  pre-commit install
repos:
  - repo: local
    hooks:
      - id: addlicense
        name: addlicense (insert SPDX/copyright header)
        entry: addlicense -f tools/license-header.txt
        language: golang
        additional_dependencies:
          - github.com/google/addlicense@v1.2.0
        # C/C++ sources + inline/template headers, plus shell and Python
        # tooling scripts. Keep this list in sync with the CI check in
        # .github/workflows/license-check.yml. (No CUDA — CPU-only project.)
        files: \.(c|cc|cxx|cpp|h|hh|hpp|hxx|inl|ipp|tpp|py|sh)$
        # Vendored third-party code keeps its own license — never inject ours.
        exclude: ^third_party/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.2
    hooks:
      - id: clang-format
        name: clang-format (C/C++ formatting)
        # Pinned (like addlicense above) rather than "language: system": the
        # tree is normalized under clang-format 23.1.2, and an unpinned
        # system hook runs whatever version a contributor happens to have —
        # a different major version fails the hook and dirties the tree on
        # their very first commit. This mirror downloads 23.1.2 itself
        # (see its pinned setup.py), so every contributor formats with the
        # same binary regardless of what (if anything) is on their PATH.
        #
        # ⚠ THIS REV AND THE PIN IN .github/workflows/clang-format.yml MUST
        # MATCH. Until 2026-10-04 this hook was pinned at v22.1.8 while CI
        # installed ubuntu-latest's unpinned clang-format (18.1.3), so the
        # hook WOULD HAVE formatted files that CI then rejects. It had not
        # actually done so: `.git/hooks/pre-commit` was absent, i.e. nobody
        # had run `pre-commit install`, which is also why the tree carried
        # violations at all. Run it — an unused hook is a pin that protects
        # nothing.
        #
        # Verified 2026-10-04 that the whole tree is clean under 23.1.2 with
        # no reformatting, so the bump from 22.1.8 moved no lines.
        args: ["-style=file"]
        # Matches the same extension set as addlicense (minus .py/.sh — clang-format is C/C++ only).
        files: \.(c|cc|cxx|cpp|h|hh|hpp|hxx|inl|ipp|tpp)$
        # Never auto-format vendored headers — preserves upstream diff-ability.
        exclude: ^third_party/
