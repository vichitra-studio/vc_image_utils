name: clang-format

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # VERSION PINNED, and this is the whole point of the next three lines.
      #
      # `apt-get install clang-format` installs whatever ubuntu-latest happens
      # to ship -- clang-format 18.1.3 as of 2026-10. clang-format's output
      # changes between major versions, so an unpinned runner REJECTS code
      # formatted by any other version and accepts code formatted by its own.
      # A green check then means only "the author's clang-format matched the
      # runner's", which is no signal at all.
      #
      # Measured 2026-10-04, and the counts differ by version, which is the
      # point: under v18 this job flagged bench/vc_bench_support.cpp,
      # examples/03_warp.cpp, examples/05_convolve.cpp, examples/06_dft.cpp
      # and tests/test_vc_perf.cpp. Under v22 a DIFFERENT set of four files
      # failed. Under v23 the whole tree is clean. Three versions, three
      # answers, same source.
      #
      # The pin MUST equal the `rev:` in .pre-commit-config.yaml. Two
      # different pins reproduce the same bug one layer up -- the hook would
      # format a file that CI then rejects. Change both or neither.
      #
      # Match it locally with:  pip install clang-format==23.1.2
      # (a venv here because ubuntu-latest's system Python is PEP-668 managed).
      - run: python3 -m venv /tmp/cfvenv
      - run: /tmp/cfvenv/bin/pip install --disable-pip-version-check clang-format==23.1.2
      - run: /tmp/cfvenv/bin/clang-format --version
      # --dry-run prints what would change; --Werror makes any change a failure.
      # The extension list MUST match the pre-commit hook in .pre-commit-config.yaml.
      - run: |
          # :!third_party/** excludes vendored headers — never auto-format upstream code.
          files=$(git ls-files \
            '*.c' '*.cc' '*.cxx' '*.cpp' \
            '*.h' '*.hh' '*.hpp' '*.hxx' \
            '*.inl' '*.ipp' '*.tpp' \
            ':!third_party/**')
          if [ -n "$files" ]; then
            /tmp/cfvenv/bin/clang-format --dry-run --Werror $files
          else
            echo "No C/C++ files to check yet."
          fi
