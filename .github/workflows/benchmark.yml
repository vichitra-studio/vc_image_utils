name: benchmark

# Two independent jobs, deliberately not split into two files (see docs/benchmarking.md
# §8's "Automated regression detection" passage for the mechanism this gates on):
#
#   `benchmark`            — push + pull_request. Builds Release-with-benchmarks ONCE,
#                             then runs each suite twice against that one build: plain
#                             (smoke) and `--compare` (regression gate). Actions' normal
#                             step-failure-stops-job semantics give the "build must
#                             succeed before anything downstream is trusted" shape for
#                             free — a broken build makes every later step's delta
#                             meaningless anyway, so there is no separate gate needed for
#                             that case.
#   `benchmark-bootstrap`  — workflow_dispatch ONLY, never push/pull_request. Generates
#                             the CI baseline this job's own `--compare` steps read, and
#                             uploads it as a build artifact for a human to download,
#                             rename, and commit. See the job's own comments below for
#                             why this cannot run automatically and why the `benchmark`
#                             job's `--compare` steps are EXPECTED to fail until that
#                             happens.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: neither job writes to the repo or needs anything beyond the default
# GITHUB_TOKEN read scope. `actions/upload-artifact` uses the runner's own
# ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN, so the bootstrap job needs no extra grant here.
permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Ninja is required by the base CMake preset elsewhere in this repo; no preset sets
      # VC_BUILD_BENCHMARKS (verified against CMakePresets.json — every configurePreset
      # is debug/release/relwithdebinfo/sanitizer variants, none touch benchmark options),
      # so this job configures ad hoc instead of via `cmake --preset`, but still needs the
      # same ninja install build.yml already uses.
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build
      - run: cmake --version && ninja --version

      # -march=x86-64-v2: pinned for COMPARABILITY, not safety. Within a single job here,
      # the binary that builds is the same binary that runs on the same VM in the same
      # step sequence, so `-march=native` could not produce an illegal-instruction crash
      # in THIS workflow the way it could if a build artifact were shipped to a different
      # host. The reason to pin anyway: the CI baseline this job's `--compare` steps read
      # (bench/baselines/ci/*.json, generated by the `benchmark-bootstrap` job below) was
      # measured on a DIFFERENT job invocation, which GitHub-hosted runners do not
      # guarantee lands on the same physical host/CPU generation as this run. `native`
      # would let the baseline and the comparison run silently target different
      # instruction sets, which is exactly the kind of "looks fine, isn't" gap this
      # workflow exists to close (see docs/benchmarking.md on why a comparison that
      # cannot be trusted must turn into exit 1 rather than "a silently clean run").
      # x86-64-v2 is a fixed, portable floor (SSE4.2/POPCNT-era) that every GitHub-hosted
      # x86_64 Linux runner supports. If a future runner image's compiler rejects this
      # psABI spelling (only GCC >= 11 / Clang >= 12 understand `-march=x86-64-v2`), the
      # documented fallback is plain `-march=x86-64` (the pre-psABI-levels generic
      # baseline) — swap the value below, nothing else in this job depends on the choice.
      - name: Configure (Release, benchmarks on, pinned -march)
        run: >
          cmake -S . -B build/bench-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVC_BUILD_BENCHMARKS=ON
          -DVC_BENCH_MARCH=x86-64-v2

      # Target names verified against CMakeLists.txt's `foreach(target vc_benchmark_harness
      # vc_benchmark_pipe vc_benchmark_pipeline)` (~line 315). No RUNTIME_OUTPUT_DIRECTORY
      # is set anywhere in CMakeLists.txt and there is no add_subdirectory in this
      # single-CMakeLists.txt project, so all three binaries land flat at the build root —
      # confirmed locally (see the human-authored PR/task notes for this change).
      - name: Build benchmark binaries
        run: >
          cmake --build build/bench-linux
          --target vc_benchmark_harness vc_benchmark_pipe vc_benchmark_pipeline

      # --- Smoke: run each suite plain, no flags. ---
      # This is real, blocking value TODAY, independent of whether a CI baseline exists:
      # every case's check() (docs/benchmarking.md §4.5) runs and aborts the process on a
      # wrong-answer kernel, so a plain run alone catches "the benchmark is timing a bug"
      # even though it says nothing about speed. It is also the ONLY part of this job that
      # was verifiable without pushing — the compare steps below cannot be, since
      # bench/baselines/ci/ does not exist in this checkout (see the note above them).
      - name: "Smoke: vc_benchmark_harness"
        run: ./build/bench-linux/vc_benchmark_harness
      - name: "Smoke: vc_benchmark_pipe"
        run: ./build/bench-linux/vc_benchmark_pipe
      - name: "Smoke: vc_benchmark_pipeline"
        run: ./build/bench-linux/vc_benchmark_pipeline

      # --- Compare: regression gate against the committed CI baseline. ---
      #
      # THE BASELINE FILES DO NOT EXIST YET. bench/baselines/ci/ is not in this checkout
      # (only the macOS bench/baselines/*.json files are committed, and those are keyed to
      # a different host/compiler/-march and must never be compared against a Linux run —
      # see docs/benchmarking.md §8). Until a human runs `benchmark-bootstrap` via
      # workflow_dispatch, downloads its artifact, renames the files (see that job's
      # comments), and commits them under bench/baselines/ci/, EACH of the three steps
      # below would hit `vc_bench: --compare could not use baseline file "...": could not
      # open file` and exit 1 if it ran — verified locally against a deliberately-missing
      # path. In practice only the FIRST one (harness) actually runs: Actions' normal
      # step-failure-stops-job behavior means the job stops there, so the pipe/pipeline
      # compare steps below never execute at all on an unbootstrapped baseline. THAT IS THE
      # DESIRED BEHAVIOR, not a bug in this workflow: a gate that cannot actually compare
      # anything must fail loudly, not report a vacuous green. Do not "fix" this by
      # loosening the exit-code handling below — fix it by running the bootstrap job.
      #
      # No `--threshold` override: the built-in 15% default was derived entirely from
      # measurements on the maintainer's macOS box (six clean runs, +8.85% top-to-bottom
      # cross-run spread on one row — docs/benchmarking.md §8), never from a GitHub-hosted
      # Linux runner. Shared CI runners are typically noisier, not quieter, than a
      # dedicated dev machine, so 15% is not known to be adequate here — but inventing a
      # CI-specific number with zero data behind it would be exactly the kind of
      # unvalidated gate this exercise exists to prevent. Leaving it at the (imperfect but
      # measured) default is the honest choice until real CI-vs-CI baseline data exists.
      #
      # Exit-code handling: GitHub Actions runs `run:` steps under
      # `bash --noprofile --norc -eo pipefail` — `set -e` is already ON, so a bare
      # invocation would kill the step on ANY non-zero exit before the code below could
      # even look at it. `set +e` / capture / `set -e` is required to inspect $? at all
      # (verified locally with a stub script). The binary's own stdout/stderr go straight
      # to the step's log (not piped through `tee`, deliberately: piping the line whose
      # $? is captured would report `tee`'s exit status, not the binary's).
      #
      #   0 -> clean comparison, nothing regressed: step passes silently.
      #   2 -> comparison ran cleanly but found a real regression: ADVISORY. Logged as a
      #        `::warning::` (surfaced in the Checks UI and the step summary) but the step
      #        still exits 0 — CI noise on this path is unmeasured (see above), so this
      #        cannot yet be trusted as a hard blocker.
      #   1 -> infrastructure failure: missing/malformed baseline, a NOT-COMPARABLE row, an
      #        unparsable row, a duplicate row/case key (fires at any filter level), zero rows
      #        ever reaching a real comparison, or a baseline row missing from this run. The
      #        last two are whole-suite-only, which is exactly what these steps run (no
      #        positional filter). See docs/benchmarking.md §8. BLOCKING — never worth
      #        softening, since it means "nothing was actually verified," not "something got
      #        slower."
      #   *  -> any other exit code (139 = SIGSEGV, 134 = SIGABRT e.g. a failed check(),
      #        127 = binary not found/exec error, ...) is UNKNOWN and must be treated as
      #        fatal, never as advisory and never as success. This arm is mandatory, not
      #        defensive filler: without it, an unrecognized code would fall through bash's
      #        `case` with no matching arm and no default action, and the step would exit 0
      #        with the last executed command's status — silently green on a crash.
      - name: Compare vc_benchmark_harness against CI baseline
        run: |
          set +e
          ./build/bench-linux/vc_benchmark_harness --compare bench/baselines/ci/harness-linux.json
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "harness: compare OK — no regression past threshold."
              ;;
            2)
              echo "::warning title=Benchmark regression (harness, advisory)::vc_benchmark_harness --compare found a real regression past the default threshold. Not blocking: CI-runner noise is unmeasured (docs/benchmarking.md Sec 8). Inspect the step log above for the delta table." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "harness: --compare could not be trusted (infrastructure failure — missing/malformed baseline, an uncomparable row, an unparsable row, a duplicate row/case key, zero rows compared, or a baseline row missing from this run). See the log above. Blocking." >&2
              exit 1
              ;;
            *)
              echo "harness: --compare exited with UNEXPECTED code $rc (139=SIGSEGV, 134=SIGABRT, 127=not found, ...). Failing closed." >&2
              exit 1
              ;;
          esac
      - name: Compare vc_benchmark_pipe against CI baseline
        run: |
          set +e
          ./build/bench-linux/vc_benchmark_pipe --compare bench/baselines/ci/pipe-linux.json
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "pipe: compare OK — no regression past threshold."
              ;;
            2)
              echo "::warning title=Benchmark regression (pipe, advisory)::vc_benchmark_pipe --compare found a real regression past the default threshold. Not blocking: CI-runner noise is unmeasured (docs/benchmarking.md Sec 8). Inspect the step log above for the delta table." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "pipe: --compare could not be trusted (infrastructure failure — missing/malformed baseline, an uncomparable row, an unparsable row, a duplicate row/case key, zero rows compared, or a baseline row missing from this run). See the log above. Blocking." >&2
              exit 1
              ;;
            *)
              echo "pipe: --compare exited with UNEXPECTED code $rc (139=SIGSEGV, 134=SIGABRT, 127=not found, ...). Failing closed." >&2
              exit 1
              ;;
          esac
      - name: Compare vc_benchmark_pipeline against CI baseline
        run: |
          set +e
          ./build/bench-linux/vc_benchmark_pipeline --compare bench/baselines/ci/pipeline-linux.json
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "pipeline: compare OK — no regression past threshold."
              ;;
            2)
              echo "::warning title=Benchmark regression (pipeline, advisory)::vc_benchmark_pipeline --compare found a real regression past the default threshold. Not blocking: CI-runner noise is unmeasured (docs/benchmarking.md Sec 8). Inspect the step log above for the delta table." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "pipeline: --compare could not be trusted (infrastructure failure — missing/malformed baseline, an uncomparable row, an unparsable row, a duplicate row/case key, zero rows compared, or a baseline row missing from this run). See the log above. Blocking." >&2
              exit 1
              ;;
            *)
              echo "pipeline: --compare exited with UNEXPECTED code $rc (139=SIGSEGV, 134=SIGABRT, 127=not found, ...). Failing closed." >&2
              exit 1
              ;;
          esac

  benchmark-bootstrap:
    # NEVER on push/pull_request — this job WRITES the CI baseline that the `benchmark`
    # job's --compare steps above read. Running it automatically on every push would let a
    # regression silently re-baseline itself the same way a bare `--baseline` overwrite
    # already can locally (docs/benchmarking.md §8, bench/baselines/README.md "Sharp
    # edge") — the whole point of `--compare` being read-only is defeated if something else
    # in the same pipeline keeps rewriting what it reads from. workflow_dispatch makes this
    # a deliberate, human-triggered action instead.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build
      - run: cmake --version && ninja --version

      # Same configure/build as the `benchmark` job above, deliberately identical
      # (including -march=x86-64-v2) — a baseline is only valid for a fixed (bench
      # definition + host + compiler + flags) tuple (docs/benchmarking.md §8), so this
      # job's build must match what `benchmark` builds, or the baseline it produces would
      # be comparing apples to a different runner's oranges from the moment it's written.
      - name: Configure (Release, benchmarks on, pinned -march)
        run: >
          cmake -S . -B build/bench-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVC_BUILD_BENCHMARKS=ON
          -DVC_BENCH_MARCH=x86-64-v2
      - name: Build benchmark binaries
        run: >
          cmake --build build/bench-linux
          --target vc_benchmark_harness vc_benchmark_pipe vc_benchmark_pipeline

      # --baseline-dir bench/baselines/ci: NEVER the compiled-in default
      # (bench/baselines/, the committed macOS series) — writing there from a Linux runner
      # would silently clobber a different host/compiler's committed history with
      # Linux-flavored numbers under the same filename stem. --baseline-dir creates
      # bench/baselines/ci/ (mkdir -p) since it does not exist in this checkout.
      #
      # KNOWN LIMITATION, load-bearing, not cosmetic: --baseline-dir only RELOCATES the
      # write, it does not RENAME. The filename stem is still host_compiler_key()
      # (`<host>-<compiler>`, e.g. an ephemeral runner hostname like
      # `fv-az123-456-GNU-11.4.0`) that will never recur on a future run — so this job
      # writes files like `bench/baselines/ci/harness-fv-az123-456-GNU-11.4.0.json`, NOT
      # the `<suite>-linux.json` name the `benchmark` job's --compare steps look for.
      # Without a manual rename, `benchmark`'s --compare steps could never find what this
      # job produced, even after the artifact is committed. After downloading the
      # `ci-benchmark-baseline` artifact below, rename each file by hand, e.g.:
      #
      #   cd bench/baselines/ci
      #   mv harness-*.json harness-linux.json
      #   mv harness-*.md   harness-linux.md
      #   mv pipe-*.json    pipe-linux.json
      #   mv pipe-*.md      pipe-linux.md
      #   mv pipeline-*.json pipeline-linux.json
      #   mv pipeline-*.md   pipeline-linux.md
      #
      # then commit the renamed files. Until this manual step happens, the `benchmark`
      # job's --compare steps keep failing with "could not open file" — by design (see
      # that job's comments).
      - name: Generate CI baseline (vc_benchmark_harness)
        run: ./build/bench-linux/vc_benchmark_harness --baseline-dir bench/baselines/ci --baseline
      - name: Generate CI baseline (vc_benchmark_pipe)
        run: ./build/bench-linux/vc_benchmark_pipe --baseline-dir bench/baselines/ci --baseline
      - name: Generate CI baseline (vc_benchmark_pipeline)
        run: ./build/bench-linux/vc_benchmark_pipeline --baseline-dir bench/baselines/ci --baseline

      # Two load-bearing details, verified — do not "simplify" either away:
      #
      # (1) `path: |` lists TWO separate glob lines (*.json and *.md), not one
      #     `bench/baselines/ci/*.{json,md}`: @actions/glob (what upload-artifact uses
      #     internally) supports only `*`, `?`, `[...]`, and `**` — no brace expansion —
      #     so a single `*.{json,md}` pattern would silently match NOTHING and this step
      #     would upload an empty artifact while still reporting success, exactly the
      #     "silently green" failure mode this whole workflow exists to avoid.
      # (2) `if-no-files-found: error` is set explicitly because the action's own default
      #     is `warn`, not `error` — a bootstrap run that (for whatever reason) produced no
      #     baseline files would, on the default, print a warning and still exit 0,
      #     yielding an empty artifact behind a green check. `error` makes that failure
      #     loud instead of silent.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-benchmark-baseline
          if-no-files-found: error
          path: |
            bench/baselines/ci/*.json
            bench/baselines/ci/*.md
